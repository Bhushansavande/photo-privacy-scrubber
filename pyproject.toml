[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-privacy-scrubber"
version = "0.1.0"
description = "Remove location, camera serial numbers and other hidden data from photos, without re-compressing them. Offline."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Bhushan Savande"}]
keywords = ["privacy", "exif", "gps", "photo", "metadata", "jpeg", "png", "webp"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics"]

[project.scripts]
photoscrub = "photoscrub.cli:main"

[tool.setuptools]
packages = ["photoscrub"]
